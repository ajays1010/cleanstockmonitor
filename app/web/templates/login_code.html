{% extends "base.html" %}
{% block title %}Enter code · StockMonitor{% endblock %}
{% block content %}
  <section class="card narrow">
    <h1>Check your email</h1>
    <p class="muted">We sent a 6-digit code to <strong>{{ email }}</strong>. It expires in 1 hour.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

    <form method="post" action="/auth/email/verify" class="stack">
      <label for="code">Code</label>
      <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code"
             pattern="[0-9 ]{6,7}" maxlength="7" required autofocus>
      <button type="submit" class="button block">Sign in</button>
    </form>

    <p class="muted"><a href="/login">Use a different email</a></p>
  </section>
{% endblock %}
