{% extends "base.html" %}
{% block title %}Dashboard · StockMonitor{% endblock %}
{% block content %}
  {% include "partials/telegram.html" %}

  {% include "partials/market_line.html" %}

  <h1>Your watchlist</h1>

  <section class="search">
    <label for="q">Add a scrip</label>
    <input id="q" name="q" type="search" placeholder="Name, NSE symbol or BSE code" autocomplete="off"
           hx-get="/watchlist/search" hx-trigger="input changed delay:300ms, search"
           hx-target="#search-results">
    <div id="search-results" aria-live="polite"></div>
  </section>

  {% include "partials/watchlist.html" %}
{% endblock %}
