{% extends "base.html" %}
{% block title %}Sign in · StockMonitor{% endblock %}
{% block content %}
  <section class="card narrow">
    <h1>Sign in</h1>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

    <a class="button block" href="/auth/google">Continue with Google</a>

    <p class="divider"><span>or get a code by email</span></p>

    <form method="post" action="/auth/email" class="stack">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <button type="submit" class="button secondary block">Email me a code</button>
    </form>
  </section>
{% endblock %}
