<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StockMonitor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v={{ css_version }}">
  {# Swap 4xx responses too, so validation errors show in place. #}
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"4..","swap":true,"error":false},{"code":"...","swap":false,"error":true}]}'>
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">StockMonitor</a>
    <nav>
      {% if user %}
        <span>{{ user.display_name or user.email }}</span>
        <form method="post" action="/logout" class="inline">
          <button type="submit" class="link">Sign out</button>
        </form>
      {% else %}
        <a href="/login">Sign in</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
