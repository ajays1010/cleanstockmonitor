# Run from the repo root:  docker compose -f docker/docker-compose.yml up -d --build
# On the VPS the image comes from GHCR instead (see .github/workflows/deploy.yml, added later).

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: ${STOCKMONITOR_IMAGE:-stockmonitor:local}
  env_file: ../.env
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  web:
    <<: *app
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: ../.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
