# Render blueprint for the BSE fetcher (app/fetcher.py), the one part that cannot run on
# the main server because BSE blocks it. See deploy/DEPLOY.md, "BSE fetcher on Render".
services:
  - type: web
    name: stockbuzz-bse-fetcher
    runtime: python
    plan: free
    region: singapore
    branch: rebuild/phase1
    buildCommand: pip install .
    startCommand: uvicorn app.fetcher:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Random value made by Render; cron-job.org sends it as the X-Fetcher-Key header.
      - key: FETCHER_SECRET
        generateValue: true
