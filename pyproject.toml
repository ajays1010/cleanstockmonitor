[project]
name = "stockmonitor"
version = "0.1.0"
description = "BSE announcement and price alerts delivered to Telegram"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  "httpx>=0.27,<0.29",
  "supabase>=2.10,<3",
  "pydantic-settings>=2.4",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "psycopg[binary]>=3.2", "python-dotenv>=1.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.web" = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The repo's supabase/ migrations folder would otherwise make ruff treat the package as first-party.
known-third-party = ["supabase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
